<app-page-header
  title="My Grades"
  subtitle="Semester grade card with SGPA trend and cumulative GPA"
/>

@if (loading()) {
  <div class="flex items-center justify-center py-20">
    <mat-spinner diameter="40" />
  </div>
} @else if (gradeCard(); as gradeCard) {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <app-stat-card label="Current SGPA" [value]="gradeCard.currentSgpa" icon="grade" tone="accent" />
    <app-stat-card label="CGPA" [value]="gradeCard.cgpa" icon="auto_graph" tone="primary" />
    <app-stat-card label="Current semester" [value]="gradeCard.currentSemester" icon="filter_1" tone="success" />
  </div>

  <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-3">
    <mat-card class="!rounded-xl lg:col-span-2">
      <mat-card-header>
        <mat-card-title class="!text-base">Subject-wise grade card</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="overflow-x-auto">
          <table mat-table [dataSource]="gradeCard.subjects" class="w-full">
            <ng-container matColumnDef="subject">
              <th mat-header-cell *matHeaderCellDef>Subject</th>
              <td mat-cell *matCellDef="let row">
                <span class="font-medium">{{ row.code }}</span>
                <span class="ml-2 text-sm text-gray-500">{{ row.name }}</span>
              </td>
            </ng-container>
            <ng-container matColumnDef="credits">
              <th mat-header-cell *matHeaderCellDef class="text-right">Credits</th>
              <td mat-cell *matCellDef="let row" class="text-right">{{ row.credits }}</td>
            </ng-container>
            <ng-container matColumnDef="max">
              <th mat-header-cell *matHeaderCellDef class="text-right">Max</th>
              <td mat-cell *matCellDef="let row" class="text-right">{{ row.totalMax }}</td>
            </ng-container>
            <ng-container matColumnDef="obtained">
              <th mat-header-cell *matHeaderCellDef class="text-right">Obtained</th>
              <td mat-cell *matCellDef="let row" class="text-right">{{ row.totalObtained }}</td>
            </ng-container>
            <ng-container matColumnDef="percentage">
              <th mat-header-cell *matHeaderCellDef class="text-right">%</th>
              <td mat-cell *matCellDef="let row" class="text-right">{{ row.percentage }}%</td>
            </ng-container>
            <ng-container matColumnDef="grade">
              <th mat-header-cell *matHeaderCellDef class="text-right">Grade</th>
              <td mat-cell *matCellDef="let row">
                <span class="font-semibold text-blue-700">{{ row.grade }}</span>
                <span class="ml-1 text-xs text-gray-500">({{ row.gradePoint }})</span>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="['subject', 'credits', 'max', 'obtained', 'percentage', 'grade']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['subject', 'credits', 'max', 'obtained', 'percentage', 'grade']"></tr>
          </table>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="!rounded-xl">
      <mat-card-header>
        <mat-card-title class="!text-base">SGPA trend</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="h-56 w-full">
          <canvas baseChart [data]="trendData()" [options]="trendOptions" type="line"> </canvas>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
}
