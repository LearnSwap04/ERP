<mat-sidenav-container class="h-full">
  <mat-sidenav [opened]="opened()" mode="side" class="w-64 border-r border-gray-200">
    <div class="flex h-16 items-center gap-2 border-b border-gray-200 px-4">
      <mat-icon class="text-blue-700" aria-hidden="true">school</mat-icon>
      <span class="text-base font-semibold text-gray-800">Student ERP</span>
    </div>
    <mat-nav-list>
      @for (item of navItems(); track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive="!bg-blue-50 !text-blue-700"
          #rla="routerLinkActive"
          class="!rounded-lg !mx-2 !mb-1"
          [class.!bg-blue-50]="rla.isActive"
        >
          <mat-icon matListItemIcon [fontIcon]="item.icon" />
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col">
    <mat-toolbar class="!bg-white !text-gray-900 !border-b !border-gray-200">
      <button mat-icon-button (click)="opened.set(!opened())" class="mr-2" matTooltip="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <button mat-button (click)="home()" class="!font-semibold !text-gray-800">
        {{ userName() }}
      </button>
      <span class="flex-1"></span>
      <span class="hidden text-sm text-gray-500 sm:block">{{ role() }}</span>
      <button mat-icon-button (click)="onLogout()" matTooltip="Sign out" class="ml-2">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
