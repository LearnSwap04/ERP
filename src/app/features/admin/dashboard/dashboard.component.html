<app-page-header title="Admin Dashboard" subtitle="System overview and quick stats" />

@if (loading) {
  <div class="flex items-center justify-center py-20">
    <mat-spinner diameter="40" />
  </div>
} @else if (data) {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-5">
    <app-stat-card label="Total users" [value]="data.counts.users" icon="group" tone="primary" />
    <app-stat-card label="Students" [value]="data.counts.students" icon="person" tone="primary" />
    <app-stat-card label="Faculty" [value]="data.counts.faculty" icon="engineering" tone="primary" />
    <app-stat-card label="Open tickets" [value]="data.counts.openTickets" icon="support_agent" tone="warn" />
    <app-stat-card label="Fees collected" [value]="data.feesPaid | currency:'INR'" icon="payments" tone="success" />
  </div>

  <mat-card class="mt-6 !rounded-xl">
    <mat-card-header>
      <mat-card-title class="!text-base">Recent notices</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @for (notice of data.recentNotices; track notice.id) {
        <div class="pb-3">
          <div class="flex items-center gap-2">
            <span class="font-medium text-gray-800">{{ notice.title }}</span>
            <span class="ml-auto text-xs text-gray-400">{{ notice.createdAt | date: 'mediumDate' }}</span>
          </div>
          <p class="mt-0.5 text-sm text-gray-500">{{ notice.body }}</p>
        </div>
      } @empty {
        <app-empty-state icon="campaign" title="No notices posted yet" />
      }
    </mat-card-content>
  </mat-card>
}
